<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Jakarta; src: url(../../app/src/main/res/font/jakarta_800.ttf); font-weight: 800; }
  @font-face { font-family: Jakarta; src: url(../../app/src/main/res/font/jakarta_600.ttf); font-weight: 600; }
  @font-face { font-family: Instrument; src: url(../../app/src/main/res/font/serif_italic.ttf); font-style: italic; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; background: #F5F2ED; font-family: Jakarta, sans-serif; color: #16151A; position: relative; }
  .mark { position: absolute; left: 64px; top: 58px; display: flex; align-items: center; gap: 14px; }
  .mark img { width: 52px; height: 52px; border-radius: 14px; }
  .mark span { font-family: Instrument; font-style: italic; font-size: 38px; letter-spacing: -0.5px; }
  h1 { position: absolute; left: 62px; top: 150px; font-size: 66px; font-weight: 800; line-height: 1; letter-spacing: -2.8px; }
  h1 em { font-family: Instrument; font-style: italic; font-weight: 400; color: #6C4DFF; font-size: 80px; letter-spacing: -1.5px; }
  p { position: absolute; left: 66px; top: 352px; font-size: 22px; font-weight: 600; color: #6E6A73; line-height: 1.4; width: 430px; }
  .disc { position: absolute; right: 40px; top: 40px; width: 420px; height: 420px; border-radius: 50%; background: #E6DFFF; }
  .card { position: absolute; width: 168px; height: 352px; border-radius: 26px; border: 6px solid #fff; overflow: hidden; background: #fff;
          box-shadow: 0 22px 44px rgba(22,21,26,.18); top: 74px; }
  .card img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .c1 { right: 290px; transform: rotate(-11deg); top: 92px; }
  .c3 { right: 50px; transform: rotate(11deg); top: 92px; }
  .c2 { right: 170px; z-index: 2; }
  .pill { position: absolute; z-index: 3; background: #16151A; color: #fff; border-radius: 999px; padding: 12px 20px; font-weight: 800; font-size: 19px;
          display: flex; align-items: center; gap: 10px; }
  .pill i { width: 11px; height: 11px; border-radius: 50%; display: block; }
</style></head>
<body>
  <div class="mark"><img src="../../docs/icon.png"><span>snapsort</span></div>
  <h1>Screenshots,<br><em>sorted.</em></h1>
  <p>Grouped by app, cleaned up in a swipe. No AI, no internet.</p>
  <div class="disc"></div>
  <div class="card c1"><img src="../../assets/demo/Screenshot_20261010-143010_Chrome.jpg"></div>
  <div class="card c3"><img src="../../assets/demo/Screenshot_20261006-171932_Spotify.jpg"></div>
  <div class="card c2"><img src="../../assets/demo/Screenshot_20261012-091522_WhatsApp.jpg"></div>
  <div class="pill" style="right: 196px; top: 420px;"><i style="background:#25D366"></i>WhatsApp</div>
  <div class="pill" style="right: 388px; top: 70px;"><i style="background:#4285F4"></i>Chrome</div>
  <div class="pill" style="right: 26px; top: 78px;"><i style="background:#1DB954"></i>Spotify</div>
</body></html>
