# Builds the signed Android release APK and publishes it as a GitHub Release.
#
# Run it from the Actions tab ("Release" > Run workflow, enter a tag like v1.2.0),
# or push a tag that starts with "v". The Release (and its tag) is created for you.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  store and key password
#   ANDROID_KEY_ALIAS          key alias ("snapsort")
#
# Without the secrets, it publishes a prebuilt APK from the `release-assets`
# branch (at <tag>/snapsort-<tag>.apk) instead, if there is one. Either way the
# APK must be signed with the release key below, or nothing is published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.2.0'
        required: true
        type: string

permissions:
  contents: write

env:
  # Fingerprint of the release signing key. Publishing fails if the APK is
  # signed with anything else (for example the throwaway debug key), because
  # in-place updates depend on this exact key.
  EXPECTED_SHA1: 'A2:C4:40:3B:63:83:C6:07:82:70:1B:D4:38:5E:18:F0:8F:D6:67:15'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          version="$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match versionName v${version}"; exit 1
          fi

      - run: ./gradlew :app:testDebugUnitTest

      - name: Restore release signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./scripts/setup-signing.sh
          mkdir -p dist
          if [ -f key.properties ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
          elif git fetch --depth=1 origin release-assets &&
               git show "FETCH_HEAD:${TAG}/snapsort-${TAG}.apk" > "dist/snapsort-${TAG}.apk"; then
            echo "::notice::No signing secrets; publishing the prebuilt APK from release-assets"
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Signing secrets are missing and there's no prebuilt APK; refusing to build with the debug key"; exit 1
          fi

      - name: Build release APK (pure Kotlin, one small APK for every phone)
        if: steps.signing.outputs.mode == 'build'
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "dist/snapsort-${TAG}.apk"

      - name: Verify the signature
        run: |
          apk="dist/snapsort-${TAG}.apk"
          apksigner="$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose "$apk"
          sha1="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-1 digest: //p' | head -1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          echo "APK signing certificate SHA-1: ${sha1}"
          if [ "${sha1}" != "${EXPECTED_SHA1}" ]; then
            echo "::error::Signed with an unexpected key (${sha1})"; exit 1
          fi

      - name: Prepare release files
        run: |
          (cd dist && sha256sum "snapsort-${TAG}.apk" > "snapsort-${TAG}.apk.sha256")
          sha="$(cut -d' ' -f1 "dist/snapsort-${TAG}.apk.sha256")"
          # What's new for this version (.github/whats-new/<tag>.md), then the standard install notes.
          { if [ -f ".github/whats-new/${TAG}.md" ]; then cat ".github/whats-new/${TAG}.md"; echo; fi
            sed -e "s/{{TAG}}/${TAG}/g" -e "s/{{SHA}}/${sha}/g" .github/release-notes.template.md; } > release-notes.md

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: SnapSort ${{ env.TAG }}
          body_path: release-notes.md
          files: |
            dist/snapsort-${{ env.TAG }}.apk
            dist/snapsort-${{ env.TAG }}.apk.sha256
          fail_on_unmatched_files: true
